<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#101c2a">
<title>Wildbound — Island Co-op</title>
<style>
:root{color-scheme:dark;--ink:#f4f3df;--muted:#a9b6b5;--mint:#a7e86e;--gold:#ffcf72;--panel:rgba(13,28,38,.78)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#142b36;color:var(--ink);font-family:Inter,ui-rounded,system-ui,-apple-system,Segoe UI,sans-serif;touch-action:none}body{user-select:none}#game{position:fixed;inset:0;width:100%;height:100%;display:block;background:#9bd5a0}.vignette{position:fixed;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(8,21,30,.31),transparent 25%,transparent 65%,rgba(7,19,28,.25));z-index:1}.hud{position:fixed;z-index:3;inset:0;pointer-events:none}.topbar{position:absolute;top:max(12px,env(safe-area-inset-top));left:16px;right:16px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:10px;padding:8px 13px 8px 9px;border:1px solid #ffffff24;background:var(--panel);border-radius:16px;backdrop-filter:blur(14px);box-shadow:0 10px 30px #10243135}.brand-mark{width:34px;height:34px;display:grid;place-items:center;background:linear-gradient(145deg,#d9fa86,#6fc76c);border-radius:11px;color:#23453b;font-size:19px}.brand-name{font-weight:900;letter-spacing:.11em;font-size:11px}.brand-sub{font-size:9px;color:#b9c9c0;letter-spacing:.12em;margin-top:3px}.stats{display:flex;gap:8px;align-items:center}.pill{padding:9px 12px;border:1px solid #ffffff24;background:var(--panel);border-radius:14px;backdrop-filter:blur(12px);font-size:11px;font-weight:800;white-space:nowrap}.pill span{color:var(--mint)}.icon-btn{pointer-events:auto;border:1px solid #ffffff24;color:var(--ink);background:var(--panel);width:38px;height:38px;border-radius:13px;font-size:17px;cursor:pointer}.quest{position:absolute;left:16px;top:76px;width:min(275px,44vw);padding:13px 15px;border:1px solid #ffffff25;background:var(--panel);border-radius:16px;backdrop-filter:blur(12px);box-shadow:0 8px 26px #152b3030}.eyebrow{font-size:9px;color:var(--mint);letter-spacing:.17em;font-weight:900}.quest h2{font-size:14px;margin:6px 0 5px}.quest p{font-size:11px;color:#c1ceca;line-height:1.45;margin:0}.quest-progress{display:flex;align-items:center;gap:8px;margin-top:11px}.bar{height:5px;border-radius:9px;background:#ffffff20;flex:1;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#9bdf68,#e2f49b);border-radius:9px;transition:width .3s}.quest-progress strong{font-size:10px;color:#dce7dc}.location{position:absolute;right:16px;top:76px;text-align:right;font-size:10px;color:#dce6db;text-shadow:0 2px 6px #183128}.location b{display:block;font-size:13px;letter-spacing:.04em;margin-bottom:3px}.toast{position:absolute;top:22%;left:50%;transform:translate(-50%,-10px);opacity:0;transition:.25s;white-space:nowrap;border:1px solid #ffffff35;background:#102631e8;padding:11px 16px;border-radius:14px;font-size:12px;font-weight:800;box-shadow:0 8px 30px #091a20aa}.toast.show{opacity:1;transform:translate(-50%,0)}.bottom-ui{position:absolute;left:0;right:0;bottom:max(14px,env(safe-area-inset-bottom));display:flex;align-items:flex-end;justify-content:space-between;padding:0 18px}.left-info{display:flex;flex-direction:column;gap:8px;width:160px}.health-label{font-size:9px;font-weight:900;letter-spacing:.13em;color:#e5efdf;display:flex;justify-content:space-between}.health{height:7px;border-radius:8px;background:#17343b;border:1px solid #ffffff24;overflow:hidden}.health i{display:block;width:100%;height:100%;background:linear-gradient(90deg,#fc8d68,#f6cb70);border-radius:8px;transition:width .25s}.inventory{display:flex;gap:5px}.item{height:31px;min-width:42px;padding:4px 7px;border:1px solid #ffffff29;background:var(--panel);border-radius:10px;font-size:10px;font-weight:800;display:flex;gap:4px;align-items:center;justify-content:center;backdrop-filter:blur(8px)}.item em{font-style:normal;color:var(--mint)}.controls{display:none;pointer-events:auto}.mobile-controls{display:flex;width:100%;align-items:flex-end;justify-content:space-between;pointer-events:auto}.stick{width:112px;height:112px;border-radius:50%;border:1px solid #ffffff3b;background:#10253078;position:relative;touch-action:none;backdrop-filter:blur(5px)}.stick:before{content:'';position:absolute;inset:20px;border:1px solid #ffffff20;border-radius:50%}.nub{position:absolute;width:44px;height:44px;left:34px;top:34px;border-radius:50%;background:linear-gradient(145deg,#e9f1d6,#a8c9a1);box-shadow:0 3px 14px #06182080;opacity:.92}.actions{display:grid;grid-template-columns:repeat(2,58px);grid-template-rows:repeat(2,58px);gap:8px;align-items:center}.action{width:58px;height:58px;border:1px solid #ffffff45;border-radius:50%;background:#102530b8;color:#f6f5e8;font-size:10px;font-weight:900;letter-spacing:.03em;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;box-shadow:0 6px 16px #09182055;touch-action:none}.action .glyph{font-size:19px;line-height:19px}.action.primary{background:linear-gradient(145deg,#e7b662,#cb734e);border-color:#ffe2a1;color:#2e3429}.action.capture{background:linear-gradient(145deg,#8de1c6,#4a9ea2);border-color:#d6ffdc;color:#193e41}.action:active{transform:scale(.94)}.hint{position:absolute;bottom:150px;left:50%;transform:translateX(-50%);padding:7px 12px;background:#122831b8;border:1px solid #ffffff22;border-radius:999px;font-size:10px;color:#f3f0d7;white-space:nowrap;backdrop-filter:blur(6px)}.dialog-backdrop{position:fixed;inset:0;background:#08151dcc;z-index:8;display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(8px)}.dialog-backdrop.open{display:flex}.dialog{width:min(440px,100%);border:1px solid #ffffff31;background:linear-gradient(145deg,#193640,#132630);border-radius:24px;padding:25px;box-shadow:0 25px 100px #0008}.dialog .tag{font-size:10px;letter-spacing:.17em;color:var(--mint);font-weight:900}.dialog h1{font-size:28px;line-height:1.05;margin:10px 0}.dialog p{font-size:13px;line-height:1.65;color:#c1d0c8}.dialog-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}.big-btn{border:0;border-radius:13px;padding:12px 16px;background:var(--mint);color:#1d382b;font-weight:900;font-size:12px;cursor:pointer}.big-btn.secondary{background:#ffffff12;color:#e9f0e5;border:1px solid #ffffff20}.code-input{width:94px;padding:11px;border:1px solid #ffffff30;background:#ffffff0b;border-radius:12px;color:#fff;text-align:center;letter-spacing:.12em;font-weight:900;text-transform:uppercase}.party-status{font-size:11px;color:#b6c8bc;margin-top:14px}.capture-flash{position:fixed;inset:0;background:#e6fff280;z-index:6;pointer-events:none;opacity:0}.capture-flash.pop{animation:flash .35s ease-out}@keyframes flash{0%{opacity:.7}100%{opacity:0}}.quest-done{color:#e6fac2!important}@media(min-width:850px){.controls{display:block}.mobile-controls{display:none}.hint{bottom:29px}.bottom-ui{padding:0 22px}.quest{top:82px}.location{top:82px}}@media(max-width:600px){.topbar{left:10px;right:10px}.brand{padding:6px 9px 6px 6px}.brand-mark{width:30px;height:30px}.brand-name{font-size:9px}.brand-sub{font-size:8px}.pill{font-size:10px;padding:8px 9px}.stats{gap:5px}.icon-btn{width:34px;height:34px}.quest{left:10px;top:64px;width:180px;padding:10px 11px}.quest h2{font-size:12px;margin:5px 0 3px}.quest p{font-size:9px}.quest-progress{margin-top:8px}.location{right:11px;top:66px;font-size:9px}.location b{font-size:11px}.bottom-ui{padding:0 13px;bottom:max(11px,env(safe-area-inset-bottom))}.left-info{width:124px;gap:6px}.item{min-width:35px;height:27px;font-size:9px;padding:3px 5px}.stick{width:100px;height:100px}.nub{width:40px;height:40px;left:29px;top:29px}.actions{grid-template-columns:repeat(2,52px);grid-template-rows:repeat(2,52px);gap:6px}.action{width:52px;height:52px;font-size:9px}.action .glyph{font-size:17px;line-height:17px}.hint{bottom:122px;font-size:9px}.stats .pill:nth-child(2){display:none}}
</style>
</head>
<body>
<canvas id="game" aria-label="Wildbound game world"></canvas><div class="vignette"></div>
<div class="hud">
  <div class="topbar"><div class="brand"><div class="brand-mark">✦</div><div><div class="brand-name">WILDBOUND</div><div class="brand-sub">ISLAND FRONTIER</div></div></div>
    <div class="stats"><div class="pill">✦ <span id="pal-count">0</span> / 3 PALS</div><div class="pill">◈ <span id="level">01</span> EXPLORER</div><button class="icon-btn" id="party-open" aria-label="Open co-op party">♧</button><button class="icon-btn" id="help-open" aria-label="How to play">?</button></div>
  </div>
  <section class="quest"><div class="eyebrow">FIELD JOURNAL · 01</div><h2 id="quest-title">A FRIEND IN THE WILD</h2><p id="quest-desc">Find a wild Pal and befriend it with a capture orb.</p><div class="quest-progress"><div class="bar"><i id="quest-bar"></i></div><strong id="quest-count">0 / 1</strong></div></section>
  <div class="location"><b>✧ SUNMEADOW ISLE</b>DAY 01 · CLEAR SKIES</div>
  <div class="toast" id="toast">A new discovery!</div>
  <div class="bottom-ui"><div class="left-info"><div class="health-label"><span>VITALS</span><span id="hp-text">100%</span></div><div class="health"><i id="hp-bar"></i></div><div class="inventory"><div class="item">◉ <em id="orb-count">5</em></div><div class="item">✿ <em id="berry-count">0</em></div><div class="item">⌁ <em id="wood-count">0</em></div></div></div>
    <div class="controls"><div class="hint" id="desktop-hint">WASD move · SPACE throw orb · F interact · J attack</div></div>
    <div class="mobile-controls"><div class="stick" id="stick"><div class="nub" id="nub"></div></div><div class="actions"><button class="action" id="interact-btn"><span class="glyph">↗</span>USE</button><button class="action capture" id="capture-btn"><span class="glyph">◉</span>ORB</button><button class="action" id="craft-btn"><span class="glyph">✧</span>CRAFT</button><button class="action primary" id="attack-btn"><span class="glyph">⚔</span>HIT</button></div></div>
  </div>
</div>
<div class="capture-flash" id="flash"></div>
<div class="dialog-backdrop" id="dialog"><div class="dialog" id="dialog-content"></div></div>
<script src="./game.js"></script>
</body></html>
